<?xml version="1.0" encoding="UTF-8"?>
<!-- Slide 12 — X-times faster summary. 3 sections × 4 metrics, no overlap. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .brand { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .body  { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="22" height="1080" fill="#ED1C24"/>
  <image href="data:image/png;base64," x="1660" y="60" width="160" height="60" preserveAspectRatio="xMaxYMid meet"/>

  <!-- header -->
  <text x="100" y="100" class="body" font-weight="700" font-size="22" letter-spacing="4" fill="#ED1C24">FASTER  ·  BIGGER  ·  CHEAPER  ·  ALL VERIFIED  ·  124 MIN STRESS TEST</text>
  <text x="100" y="170" class="brand" font-size="60" fill="#000000" letter-spacing="-2">62 verified data points. Every "X times" measured.</text>

  <!-- HERO red banner — Hakob 6.49× -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="1720" height="160" fill="#ED1C24"/>
    <text x="40" y="50" class="body" font-weight="700" font-size="22" letter-spacing="3" fill="#FFFFFF">THE NUMBER HAKOB WAS LOOKING FOR  ·  8K vs 32K aggregate throughput at N=31:</text>
    <text x="40" y="115" class="brand" font-size="78" fill="#FFFFFF">6.49× faster</text>
    <text x="500" y="115" class="body" font-weight="500" font-size="34" fill="#FFFFFF">on 8K context (78.5 tok/s) vs 32K context (12.08 tok/s)</text>
  </g>

  <!-- SECTION 1: FASTER -->
  <text x="100" y="440" class="body" font-weight="700" font-size="22" letter-spacing="3" fill="#666666">FASTER  ·  THROUGHPUT &amp; LATENCY</text>
  <line x1="100" y1="455" x2="1820" y2="455" stroke="#E5E5E5" stroke-width="2"/>

  <g transform="translate(100, 490)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">5.12×</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">AITER throughput @ 64K×31</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">18.46 vs 3.61 tok/s</text>
  </g>
  <g transform="translate(530, 490)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">3.57×</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">AITER boost @ 32K×16</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">42.30 vs 11.87 tok/s</text>
  </g>
  <g transform="translate(960, 490)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">2.83×</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">AITER TTFT @ 64K hot</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">3.54s vs 10.01s</text>
  </g>
  <g transform="translate(1390, 490)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">2.59s</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">ingest 1.3M-token repo</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">pytorch/vision (581 files)</text>
  </g>

  <!-- SECTION 2: BIGGER -->
  <text x="100" y="660" class="body" font-weight="700" font-size="22" letter-spacing="3" fill="#666666">BIGGER  ·  CAPACITY &amp; CONCURRENCY</text>
  <line x1="100" y1="675" x2="1820" y2="675" stroke="#E5E5E5" stroke-width="2"/>

  <g transform="translate(100, 710)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">2.4×</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">VRAM vs H100 single-card</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">192 GB vs 80 GB</text>
  </g>
  <g transform="translate(530, 710)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">5.1×</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">larger repo than context</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">1.3M tokens / 256K window</text>
  </g>
  <g transform="translate(960, 710)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">31×</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">concurrent users at 8K</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">31/31 success @ N=31</text>
  </g>
  <g transform="translate(1390, 710)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">144/144</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">outputs clean (Triton)</text>
    <text x="0" y="110" class="mono" font-weight="500" font-size="13" fill="#666666">vs AITER 137/144 broken</text>
  </g>

  <!-- SECTION 3: CHEAPER -->
  <text x="100" y="880" class="body" font-weight="700" font-size="22" letter-spacing="3" fill="#666666">CHEAPER  ·  COST PER WORKLOAD</text>
  <line x1="100" y1="895" x2="1820" y2="895" stroke="#E5E5E5" stroke-width="2"/>

  <g transform="translate(100, 930)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">$1.99</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">/hr  ·  AMD Cloud rental</text>
  </g>
  <g transform="translate(530, 930)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">$45.75</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">per 1M completion tokens (32K×31)</text>
  </g>
  <g transform="translate(960, 930)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">$4.12</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">total cost of 124-min full stress test</text>
  </g>
  <g transform="translate(1390, 930)">
    <text x="0" y="50" class="brand" font-size="56" fill="#ED1C24">3-6 mo</text>
    <text x="0" y="85" class="body" font-weight="600" font-size="18" fill="#000000">break-even vs Cursor @ 100 devs</text>
  </g>

  <!-- footer -->
  <text x="100" y="1055" class="mono" font-weight="600" font-size="13" fill="#666666">All numbers from 7 JSON results · 5 plots · 3 vLLM startup logs · 2 rocm-smi snapshots · 124 min wall clock · $4.12 total</text>
</svg>
