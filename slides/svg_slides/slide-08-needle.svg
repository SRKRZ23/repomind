<?xml version="1.0" encoding="UTF-8"?>
<!-- Slide 8 — Long-context coherence at 200K. Needle-in-haystack proof. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .brand { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; }
      .body  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="22" height="1080" fill="#ED1C24"/>

  <image href="data:image/png;base64," x="1700" y="65" width="160" height="80" preserveAspectRatio="xMidYMid meet"/>
  <image href="data:image/png;base64," x="1500" y="80" width="180" height="60" preserveAspectRatio="xMidYMid meet"/>

  <text x="100" y="110" class="body" font-weight="700" font-size="26" letter-spacing="4" fill="#ED1C24">LONG-CONTEXT COHERENCE  ·  NEEDLE-IN-HAYSTACK AT 200K</text>
  <text x="100" y="200" class="brand" font-size="80" fill="#000000" letter-spacing="-2">256K window is usable, not just allocated.</text>

  <!-- The test description -->
  <g transform="translate(100, 280)">
    <text x="0" y="0" class="body" font-weight="700" font-size="22" letter-spacing="3" fill="#666666">TEST METHODOLOGY:</text>
    <text x="0" y="40" class="body" font-weight="500" font-size="26" fill="#000000">Embedded a unique sentinel function</text>
    <text x="700" y="40" class="mono" font-weight="600" font-size="26" fill="#ED1C24">calc_repomind_token_budget_v7</text>
    <text x="0" y="80" class="body" font-weight="500" font-size="26" fill="#000000">+ magic constant </text>
    <text x="220" y="80" class="mono" font-weight="600" font-size="26" fill="#ED1C24">4242</text>
    <text x="290" y="80" class="body" font-weight="500" font-size="26" fill="#000000">inside ~200K-token code corpus.</text>
    <text x="0" y="120" class="body" font-weight="500" font-size="26" fill="#000000">Asked the model to recover both via JSON. Pass = both substrings in response.</text>
  </g>

  <!-- Results table -->
  <g transform="translate(100, 480)">
    <text x="0"   y="0" class="body" font-weight="700" font-size="26" fill="#666666">POSITION</text>
    <text x="500" y="0" class="body" font-weight="700" font-size="26" fill="#666666">PROMPT TOKENS</text>
    <text x="900" y="0" class="body" font-weight="700" font-size="26" fill="#666666">ELAPSED</text>
    <text x="1200" y="0" class="body" font-weight="700" font-size="26" fill="#666666">FOUND NAME</text>
    <text x="1500" y="0" class="body" font-weight="700" font-size="26" fill="#666666">FOUND CONST</text>

    <line x1="0" y1="20" x2="1720" y2="20" stroke="#000000" stroke-width="2"/>

    <text x="0"    y="80" class="brand" font-size="32" fill="#000000">early</text>
    <text x="500"  y="80" class="brand" font-size="32" fill="#000000">99,814</text>
    <text x="900"  y="80" class="brand" font-size="32" fill="#000000">29.0s</text>
    <text x="1200" y="80" class="brand" font-size="32" fill="#ED1C24">✓</text>
    <text x="1500" y="80" class="brand" font-size="32" fill="#ED1C24">✓</text>
    <line x1="0" y1="105" x2="1720" y2="105" stroke="#E5E5E5" stroke-width="1"/>

    <text x="0"    y="170" class="brand" font-size="40" fill="#000000">middle</text>
    <text x="500"  y="170" class="brand" font-size="40" fill="#ED1C24">199,413</text>
    <text x="900"  y="170" class="brand" font-size="40" fill="#000000">73.2s</text>
    <text x="1200" y="170" class="brand" font-size="40" fill="#ED1C24">✓</text>
    <text x="1500" y="170" class="brand" font-size="40" fill="#ED1C24">✓</text>
    <line x1="0" y1="195" x2="1720" y2="195" stroke="#E5E5E5" stroke-width="1"/>

    <text x="0"    y="260" class="brand" font-size="32" fill="#000000">late</text>
    <text x="500"  y="260" class="brand" font-size="32" fill="#000000">99,814</text>
    <text x="900"  y="260" class="brand" font-size="32" fill="#000000">20.5s</text>
    <text x="1200" y="260" class="brand" font-size="32" fill="#ED1C24">✓</text>
    <text x="1500" y="260" class="brand" font-size="32" fill="#ED1C24">✓</text>
    <line x1="0" y1="290" x2="1720" y2="290" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Big result -->
  <text x="960" y="900" text-anchor="middle" class="brand" font-size="180" fill="#ED1C24">3 / 3 PASS</text>

  <text x="100" y="1010" class="body" font-weight="700" font-size="28" fill="#000000">Many "256K window" claims are allocation only — accuracy collapses past 64K. Qwen3-Coder-Next on MI300X actually attends.</text>
  <text x="100" y="1050" class="mono" font-weight="600" font-size="14" fill="#666666">benchmarks/2026-05-05-mi300x-stress-test/bench_long_context.json</text>
</svg>
