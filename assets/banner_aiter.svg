<?xml version="1.0" encoding="UTF-8"?>
<!--
REPOMIND AITER tuning regression banner — 1920×1080 light theme.
White bg / black text / red accent. Maximum readability.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .brand { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; }
      .body  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- White canvas -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Red accent stripe (left edge) -->
  <rect x="0" y="0" width="22" height="1080" fill="#ED1C24"/>

  <!-- Top eyebrow -->
  <text x="100" y="110" class="body" font-weight="700" font-size="26" letter-spacing="4" fill="#ED1C24">TUNING ATTEMPT  ·  MEASURED REGRESSION</text>

  <!-- AMD logo top-right -->
  <image href="data:image/png;base64," x="1700" y="65" width="160" height="80" preserveAspectRatio="xMidYMid meet"/>

  <!-- Big title -->
  <text x="100" y="280" class="brand" font-size="120" fill="#000000" letter-spacing="-3">AITER backend</text>
  <text x="100" y="400" class="brand" font-size="100" fill="#ED1C24" letter-spacing="-2">→ broke output on FP8 KV cache</text>

  <!-- Subtitle -->
  <text x="100" y="470" class="body" font-weight="400" font-size="32" fill="#000000">We tried AMD's hand-tuned MI300X attention kernel. Throughput went UP 2-4×.</text>
  <text x="100" y="510" class="body" font-weight="400" font-size="32" fill="#000000">Output went to repeating-punctuation gibberish. Reporting it openly.</text>

  <!-- A/B comparison table -->
  <g transform="translate(100, 580)">
    <!-- Header -->
    <text x="0"    y="40" class="body" font-weight="700" font-size="28" fill="#666666">CONFIG</text>
    <text x="600"  y="40" class="body" font-weight="700" font-size="28" fill="#666666">DEFAULT TRITON</text>
    <text x="1100" y="40" class="body" font-weight="700" font-size="28" fill="#666666">AITER (FP8 KV)</text>

    <line x1="0" y1="60" x2="1820" y2="60" stroke="#000000" stroke-width="2"/>

    <!-- Row 1 -->
    <text x="0"    y="115" class="body" font-weight="600" font-size="26" fill="#000000">Output quality (144 cells)</text>
    <text x="600"  y="115" class="brand" font-size="34" fill="#000000">0/144 broken ✓</text>
    <text x="1100" y="115" class="brand" font-size="34" fill="#ED1C24">137/144 broken ✗</text>

    <line x1="0" y1="145" x2="1820" y2="145" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="0"    y="200" class="body" font-weight="600" font-size="26" fill="#000000">8K × 31 throughput</text>
    <text x="600"  y="200" class="brand" font-size="32" fill="#000000">78.5 tok/s</text>
    <text x="1100" y="200" class="brand" font-size="32" fill="#ED1C24">168.4 tok/s (+114%)</text>

    <line x1="0" y1="230" x2="1820" y2="230" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="0"    y="285" class="body" font-weight="600" font-size="26" fill="#000000">64K × 31 throughput</text>
    <text x="600"  y="285" class="brand" font-size="32" fill="#000000">3.61 tok/s</text>
    <text x="1100" y="285" class="brand" font-size="32" fill="#ED1C24">18.5 tok/s (+411%)</text>

    <line x1="0" y1="315" x2="1820" y2="315" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="0"    y="370" class="body" font-weight="600" font-size="26" fill="#000000">TTFT @ 64K hot</text>
    <text x="600"  y="370" class="brand" font-size="32" fill="#000000">10.01s</text>
    <text x="1100" y="370" class="brand" font-size="32" fill="#ED1C24">3.54s (~2.8× faster)</text>
  </g>

  <!-- Footer -->
  <text x="100" y="1040" class="mono" font-weight="600" font-size="20" fill="#000000">Production-safe = default Triton  ·  AITER filed for AMD upstream  ·  github.com/SRKRZ23/repomind</text>
</svg>
