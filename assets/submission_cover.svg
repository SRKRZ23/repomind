<?xml version="1.0" encoding="UTF-8"?>
<!-- Lablab submission cover — 1200x630, new DAG logo, clean, verified-numbers-first. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .brand { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .body  { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="0" y="0" width="14" height="630" fill="#ED1C24"/>

  <!-- top header -->
  <image href="data:image/png;base64," x="1030" y="32" width="120" height="42" preserveAspectRatio="xMaxYMid meet"/>
  <text x="60" y="60" class="body" font-weight="700" font-size="16" letter-spacing="3" fill="#ED1C24">AMD DEVELOPER HACKATHON  ·  MAY 11, 2026</text>

  <!-- DAG logo + wordmark row -->
  <g transform="translate(60, 100)">
    <rect width="140" height="140" fill="#000000" rx="20"/>
    <line x1="70" y1="46" x2="38" y2="98" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="46" x2="70" y2="98" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="46" x2="102" y2="98" stroke="#ED1C24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="46" r="13" fill="#FFFFFF"/>
    <circle cx="38" cy="98" r="9"  fill="#FFFFFF"/>
    <circle cx="70" cy="98" r="9"  fill="#FFFFFF"/>
    <circle cx="102" cy="98" r="11" fill="#ED1C24"/>
  </g>

  <text x="220" y="160" class="brand" font-size="92" fill="#000000" letter-spacing="-3">REPOMIND</text>
  <text x="220" y="200" class="body" font-weight="400" font-size="22" fill="#000000">Open-source repo-scale coding agent on a single AMD MI300X.</text>
  <text x="220" y="228" class="body" font-weight="400" font-size="16" fill="#666666">256K context  ·  FP8  ·  MIT  ·  self-hosted  ·  production-verified</text>

  <line x1="60" y1="280" x2="1140" y2="280" stroke="#E5E5E5" stroke-width="2"/>

  <!-- Memory chart -->
  <text x="60" y="310" class="body" font-weight="700" font-size="13" letter-spacing="2" fill="#666666">MEMORY NEEDED — Qwen3-Coder-Next-FP8 + 256K + FP8 KV cache ≈ 143 GiB</text>

  <text x="60" y="345" class="body" font-weight="700" font-size="18" fill="#000000">AMD MI300X</text>
  <rect x="60" y="358" width="780" height="34" fill="#ED1C24"/>
  <text x="855" y="384" class="brand" font-size="22" fill="#000000">192 GB</text>

  <text x="60" y="425" class="body" font-weight="700" font-size="18" fill="#000000">NVIDIA H100</text>
  <rect x="60" y="438" width="325" height="34" fill="#000000"/>
  <text x="400" y="464" class="brand" font-size="22" fill="#000000">80 GB</text>
  <text x="495" y="464" class="body" font-weight="800" font-size="18" fill="#ED1C24">cannot fit by VRAM math</text>

  <line x1="60" y1="495" x2="1140" y2="495" stroke="#E5E5E5" stroke-width="2"/>

  <!-- KPI strip -->
  <text x="60" y="520" class="body" font-weight="700" font-size="13" letter-spacing="2" fill="#666666">EMPIRICALLY VERIFIED — 124 MIN STRESS TEST · $4.12 OF COMPUTE · 6.5 DAYS SOLO</text>

  <g transform="translate(60, 540)">
    <text x="0"   y="30" class="brand" font-size="36" fill="#ED1C24">62</text>
    <text x="0"   y="56" class="body" font-weight="600" font-size="12" fill="#000000">verified data points</text>
  </g>
  <g transform="translate(220, 540)">
    <text x="0"   y="30" class="brand" font-size="36" fill="#ED1C24">6.49×</text>
    <text x="0"   y="56" class="body" font-weight="600" font-size="12" fill="#000000">faster on 8K vs 32K (N=31)</text>
  </g>
  <g transform="translate(440, 540)">
    <text x="0"   y="30" class="brand" font-size="36" fill="#ED1C24">9/9</text>
    <text x="0"   y="56" class="body" font-weight="600" font-size="12" fill="#000000">repo Q&amp;A correct (3 repos)</text>
  </g>
  <g transform="translate(640, 540)">
    <text x="0"   y="30" class="brand" font-size="36" fill="#ED1C24">3/3</text>
    <text x="0"   y="56" class="body" font-weight="600" font-size="12" fill="#000000">needle pass at 200K tokens</text>
  </g>
  <g transform="translate(850, 540)">
    <text x="0"   y="30" class="brand" font-size="36" fill="#ED1C24">144/144</text>
    <text x="0"   y="56" class="body" font-weight="600" font-size="12" fill="#000000">outputs clean (default Triton)</text>
  </g>
  <g transform="translate(1060, 540)">
    <text x="0"   y="30" class="brand" font-size="36" fill="#ED1C24">MIT</text>
    <text x="0"   y="56" class="body" font-weight="600" font-size="12" fill="#000000">open source</text>
  </g>

  <!-- footer -->
  <text x="60" y="615" class="mono" font-weight="600" font-size="11" fill="#000000">github.com/SRKRZ23/repomind  ·  Sardor Razikov  ·  Tashkent  ·  Built for AMD Developer Hackathon 2026</text>
</svg>
