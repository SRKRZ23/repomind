-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .brand { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; }
      .body  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="22" height="1080" fill="#ED1C24"/>

  <image href="data:image/png;base64," x="1700" y="65" width="160" height="80" preserveAspectRatio="xMidYMid meet"/>

  <text x="100" y="110" class="body" font-weight="700" font-size="26" letter-spacing="4" fill="#ED1C24">THE NUMBER HAKOB WAS LOOKING FOR  ·  AMD DEVELOPER COMMUNITY THREAD #505</text>
  <text x="100" y="180" class="brand" font-size="44" fill="#000000" letter-spacing="-2">"30 tok/s at 8K feels slow for 80B MoE..."  — Hakob</text>
  <text x="100" y="250" class="brand" font-size="44" fill="#000000" letter-spacing="-2">"What does concurrency look like at 8K-32K?"  — Hakob</text>

  <!-- The 6.5× HERO -->
  <g transform="translate(0, 460)">
    <text x="960" y="0" text-anchor="middle" class="brand" font-size="200" fill="#ED1C24" letter-spacing="-15">6.49×</text>
    <text x="960" y="80" text-anchor="middle" class="brand" font-size="48" fill="#000000">faster on 8K vs 32K — measured</text>
  </g>

  <!-- Comparison numbers -->
  <g transform="translate(100, 740)">
    <text x="0" y="0" class="body" font-weight="700" font-size="22" letter-spacing="3" fill="#666666">VERIFIED ON REAL MI300X — 24-CELL CONCURRENCY MATRIX:</text>

    <g transform="translate(0, 50)">
      <text x="0"   y="40" class="body" font-weight="600" font-size="32" fill="#000000">8K context · 31 concurrent users · default Triton</text>
      <text x="1720" y="40" text-anchor="end" class="brand" font-size="48" fill="#ED1C24">78.5 tok/s</text>
    </g>

    <g transform="translate(0, 110)">
      <text x="0"   y="40" class="body" font-weight="600" font-size="32" fill="#000000">32K context · 31 concurrent users · default Triton</text>
      <text x="1720" y="40" text-anchor="end" class="brand" font-size="48" fill="#000000">12.08 tok/s</text>
    </g>

    <line x1="0" y1="170" x2="1720" y2="170" stroke="#000000" stroke-width="2"/>

    <g transform="translate(0, 200)">
      <text x="0"   y="40" class="brand" font-size="32" fill="#ED1C24">RATIO</text>
      <text x="1720" y="40" text-anchor="end" class="brand" font-size="56" fill="#ED1C24">6.49× higher throughput</text>
