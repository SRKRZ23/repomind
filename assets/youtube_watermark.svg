<?xml version="1.0" encoding="UTF-8"?>
<!-- YouTube watermark — 150x150, transparent bg so it overlays video without a black box.
     White edges/nodes + red accent so it stays visible on most footage. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <line x1="256" y1="172" x2="138" y2="350" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="172" x2="256" y2="350" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="172" x2="374" y2="350" stroke="#ED1C24" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="172" r="44" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="138" cy="350" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="256" cy="350" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="374" cy="350" r="36" fill="#ED1C24" stroke="#000000" stroke-width="3"/>
</svg>
