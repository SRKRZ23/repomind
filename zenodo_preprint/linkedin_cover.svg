<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- REPOMIND brand palette (matches preprint + slide deck):
       text     #000000 / #444444 / #666666
       accent   #ED1C24 (AMD red)
       bg       #FFFFFF
       divider  #E5E5E5
       subtle   #FAFAFA / #F5F5F5
       light red #FFE5E5
       fonts    Helvetica Neue (brand + body), Menlo (mono)
  -->

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#E5E5E5"/>
    </pattern>
  </defs>

  <!-- White / subtle gradient base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.4"/>

  <!-- Left red accent stripe (mirrors slide-08 + preprint cover treatment) -->
  <rect x="0" y="0" width="14" height="630" fill="#ED1C24"/>

  <!-- Top hairline accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#ED1C24"/>

  <!-- Top label -->
  <text x="60" y="60" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ED1C24" letter-spacing="3">
    METHODOLOGY PREPRINT  ·  PUBLISHED 2026-05-21  ·  CC-BY-4.0
  </text>

  <!-- Big REPOMIND title -->
  <text x="60" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="78" font-weight="900" fill="#000000" letter-spacing="-2">REPOMIND</text>

  <!-- Subtitle (slightly smaller) -->
  <text x="60" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#444444" letter-spacing="-0.5">
    Reproducing 256K-context repository-scale code understanding
  </text>
  <text x="60" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#444444" letter-spacing="-0.5">
    on a single AMD MI300X with FP8 KV cache
  </text>

  <!-- Divider -->
  <line x1="60" y1="270" x2="220" y2="270" stroke="#ED1C24" stroke-width="3"/>

  <!-- Key stats — 4 boxes -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- Stat 1 -->
    <g transform="translate(60, 295)">
      <rect x="0" y="0" width="240" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2"/>
      <rect x="0" y="0" width="240" height="4" fill="#ED1C24"/>
      <text x="20" y="50" font-size="36" font-weight="900" fill="#000000" letter-spacing="-1">31/31</text>
      <text x="20" y="74" font-size="11" font-weight="600" fill="#666666" letter-spacing="1.5">PARALLEL USERS @ 8K-64K</text>
      <text x="20" y="89" font-size="10" font-weight="400" fill="#666666">144/144 clean outputs · default Triton</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(320, 295)">
      <rect x="0" y="0" width="240" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2"/>
      <rect x="0" y="0" width="240" height="4" fill="#ED1C24"/>
      <text x="20" y="50" font-size="36" font-weight="900" fill="#000000" letter-spacing="-1">137/144</text>
      <text x="20" y="74" font-size="11" font-weight="600" fill="#666666" letter-spacing="1.5">AITER × FP8 BROKEN CELLS</text>
      <text x="20" y="89" font-size="10" font-weight="400" fill="#666666">Open regression report · filed upstream</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(580, 295)">
      <rect x="0" y="0" width="240" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2"/>
      <rect x="0" y="0" width="240" height="4" fill="#ED1C24"/>
      <text x="20" y="50" font-size="36" font-weight="900" fill="#000000" letter-spacing="-1">3/3</text>
      <text x="20" y="74" font-size="11" font-weight="600" fill="#666666" letter-spacing="1.5">NEEDLE PASS AT 200K</text>
      <text x="20" y="89" font-size="10" font-weight="400" fill="#666666">9/9 e2e repo Q&amp;A · pytorch/vision 1.3M tok</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(840, 295)">
      <rect x="0" y="0" width="300" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.2"/>
      <rect x="0" y="0" width="300" height="4" fill="#ED1C24"/>
      <text x="20" y="50" font-size="36" font-weight="900" fill="#000000" letter-spacing="-1">$4.12</text>
      <text x="20" y="74" font-size="11" font-weight="600" fill="#666666" letter-spacing="1.5">TOTAL COMPUTE COST</text>
      <text x="20" y="89" font-size="10" font-weight="400" fill="#666666">2 sessions · 124 min · AMD Developer Cloud</text>
    </g>
  </g>

  <!-- DOI prominent line -->
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="1080" height="46" fill="#FFE5E5" rx="3"/>
    <rect x="0" y="0" width="6" height="46" fill="#ED1C24"/>
    <text x="22" y="20" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="700" fill="#ED1C24" letter-spacing="2">DOI</text>
    <text x="22" y="38" font-family="'Menlo', 'Monaco', 'Courier New', monospace"
          font-size="16" font-weight="700" fill="#000000">10.5281/zenodo.20330468</text>
    <text x="320" y="38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" fill="#444444">→ https://doi.org/10.5281/zenodo.20330468</text>
  </g>

  <!-- Credit strip (text-based, avoids logo trademark risk) -->
  <g transform="translate(60, 510)">
    <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="600" fill="#666666" letter-spacing="2">
      INDEXED IN / HOSTED BY / BUILT ON
    </text>
    <text x="0" y="22" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" fill="#000000">
      Zenodo  ·  OpenAIRE  ·  AMD MI300X (ROCm 7.2 · vLLM 0.17.1)
    </text>
    <text x="0" y="42" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" fill="#000000">
      AMD Developer Hackathon 2026 (lablab.ai)  ·  Qwen3-Coder-Next-FP8 (Alibaba Cloud)  ·  Hugging Face Spaces
    </text>
  </g>

  <!-- Bottom: author + ORCID -->
  <g transform="translate(60, 595)">
    <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" fill="#000000">
      Sardor Razikov
    </text>
    <text x="135" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="12" font-weight="400" fill="#666666">
      Independent ML Engineer, Tashkent, Uzbekistan  ·  ORCID 0009-0007-0731-4247
    </text>
  </g>

  <!-- REPOMIND mark — right side -->
  <g transform="translate(1080, 70)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ED1C24" stroke-width="2.5"/>
    <text x="0" y="8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="900" text-anchor="middle" fill="#ED1C24">RM</text>
  </g>

  <!-- Right column "thanks" panel -->
  <g transform="translate(1080, 595)" text-anchor="end">
    <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="11" font-weight="500" fill="#666666">
      MIT-licensed code · CC-BY-4.0 preprint · 23 pages · 6,000 words
    </text>
  </g>
</svg>
